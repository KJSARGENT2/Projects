<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>Fenrir Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #05080d; --panel: #0a0f16; --panel2: #0f1724; --field: #10151d;
  --line: #00d9ff38; --line2: #00d9ff1f; --text: #d8e0ea; --muted: #7d8899;
  --neon: #00d9ff; --deep: #1f6bff; --ice: #9af0ff; --coin: #ffcf8a; --danger: #ff3d71; --violet: #7a5cff;
  --display: 'Lilita One', 'Baloo 2', ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --ui: 'Baloo 2', ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --gloss: inset 0 1px 0 rgba(255,255,255,.16), inset 0 -2px 0 rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.55);
  --r: 20px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(900px 600px at 50% -10%, #00d9ff14, transparent 60%), radial-gradient(700px 500px at 100% 100%, #1f6bff12, transparent 60%);
  color: var(--text); font-family: var(--ui); font-size: 15px; line-height: 1.3;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: none; }

/* ---------- App shell ---------- */
.app {
  position: relative; max-width: 480px; margin: 0 auto; height: 100%; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(180deg, #071019 0%, var(--bg) 40%);
  box-shadow: 0 0 0 1px #00d9ff14, 0 0 80px #00d9ff0d;
}
.topbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: linear-gradient(180deg, #0c1624, #08101a);
  border-bottom: 1px solid var(--line2);
  position: relative; z-index: 5;
}
.pill {
  display: flex; align-items: center; gap: 6px; height: 34px; border-radius: 999px;
  background: linear-gradient(180deg, #16233a, #0a111c); border: 1px solid var(--line);
  box-shadow: var(--gloss); padding: 0 10px 0 4px; font-weight: 800; font-size: 15px; color: #f1f7ff;
  min-width: 0;
}
.pill .ic { width: 26px; height: 26px; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.pill .val { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
.lvl { flex: 1.25; position: relative; padding-left: 0; min-width: 96px; }
.shield { position: relative; width: 36px; height: 38px; margin: -4px -2px -4px -6px; flex: none; }
.shield svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 6px #00d9ff66); }
.shield b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: #fff; padding-bottom: 2px; text-shadow: 0 1px 0 #06224f; }
.xpbar { position: relative; flex: 1; height: 18px; border-radius: 999px; background: #05080d; box-shadow: inset 0 2px 3px rgba(0,0,0,.8); overflow: hidden; }
.xpbar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(180deg, #7ff3ff, #00d9ff 50%, #1f6bff); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); transition: width .6s ease; }
.xpbar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000; }
.gems { flex: 1; }
.coins { flex: 1.1; padding-right: 3px; }
.plus {
  width: 26px; height: 26px; border-radius: 9px; flex: none; position: relative;
  background: linear-gradient(180deg, #6ff0ff, #00b8e6); color: #05080d; font-weight: 800; font-size: 20px; line-height: 1;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 #0a5f8c; display: grid; place-items: center;
}
.plus .dot { top: -5px; right: -5px; }
.avatar-btn { flex: none; position: relative; }

/* avatar + frames */
.ava { --s: 40px; display: block; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .28); padding: 3px; position: relative; flex: none;
  background: linear-gradient(135deg, var(--neon), var(--deep)); box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 12px #00d9ff44; }
.ava .in { display: grid; width: 100%; height: 100%; border-radius: calc(var(--s) * .2); background: radial-gradient(circle at 50% 30%, #12304a, #070c14 75%); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.15); }
.ava .in svg { width: 78%; height: 78%; }
.ava .bdg { display: grid; position: absolute; right: -6px; bottom: -6px; width: calc(var(--s) * .44); height: calc(var(--s) * .44); min-width: 16px; min-height: 16px; border-radius: 50%; background: #05080d; border: 1.5px solid var(--line); display: grid; place-items: center; }
.ava .bdg svg { width: 70%; height: 70%; }
.f-ice { background: linear-gradient(135deg, #ffffff, var(--ice) 40%, var(--neon)); box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px #9af0ff66; }
.f-deep { background: linear-gradient(135deg, var(--deep), var(--violet)); box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px #7a5cff66; }
.f-gold { background: linear-gradient(135deg, #fff3d6, var(--coin) 45%, #c98a3a); box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px #ffcf8a66; }
.f-blood { background: linear-gradient(135deg, #ffb3c6, var(--danger) 50%, #7a0f2e); box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px #ff3d7166; }
.f-ragnarok { background: linear-gradient(90deg, var(--neon), var(--violet), var(--danger), var(--coin), var(--neon)); background-size: 300% 100%; animation: slide 4s linear infinite; box-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 16px #7a5cff77; }
@keyframes slide { to { background-position: 300% 0; } }

/* ---------- Scroll area ---------- */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 24px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* event strip */
.strip-wrap { background: linear-gradient(180deg, #08101a, #0a1320); border-bottom: 1px solid var(--line2); }
.strip { display: grid; grid-auto-flow: column; grid-template-rows: auto auto; grid-auto-columns: 84px; gap: 6px 4px; padding: 10px 10px 10px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
.strip::-webkit-scrollbar { display: none; }
.ev { display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; scroll-snap-align: start; padding: 2px 0; border-radius: 16px; transition: transform .12s; }
.ev:active { transform: scale(.93); }
.ev .art { width: 58px; height: 50px; display: grid; place-items: center; position: relative; }
.ev .art svg { width: 50px; height: 50px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.ev .lab { font-family: var(--display); font-size: 12.5px; color: #eaf6ff; line-height: 1; text-shadow: 0 2px 0 #06224f; white-space: nowrap; }
.ev .tm { font-size: 12px; font-weight: 800; color: #eaf6ff; background: rgba(5,8,13,.75); border: 1px solid var(--line2); border-radius: 999px; padding: 1px 8px 0; font-variant-numeric: tabular-nums; min-width: 66px; text-align: center; }
.ev .tm.go { background: linear-gradient(180deg, #6ff0ff, #00b8e6); color: #05080d; border-color: transparent; box-shadow: 0 0 12px #00d9ff66; }
.ev .dot { top: 0; right: 10px; }
.chal { font-family: var(--display); text-align: center; line-height: .8; color: #fff; }
.chal b { display: block; font-size: 36px; font-weight: 400; color: var(--coin); -webkit-text-stroke: 4px #05080d; paint-order: stroke fill; text-shadow: 0 3px 0 #1f6bff; }
.chal span { font-size: 11px; letter-spacing: .02em; color: var(--ice); -webkit-text-stroke: 3px #05080d; paint-order: stroke fill; }
.streakn { position: absolute; bottom: 2px; right: 2px; font-family: var(--display); font-size: 18px; color: #fff; -webkit-text-stroke: 4px #05080d; paint-order: stroke fill; }

/* missions row */
.mrow { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: linear-gradient(180deg, #0c1624, #0a121c); border-bottom: 1px solid var(--line2); }
.sqbtn { position: relative; width: 68px; height: 60px; border-radius: 16px; background: linear-gradient(180deg, #1c3a6b, #10213d); border: 1px solid var(--line); box-shadow: var(--gloss), 0 0 14px #1f6bff33; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; transition: transform .12s; }
.sqbtn:active { transform: scale(.94); }
.sqbtn svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
.sqbtn span { font-family: var(--display); font-size: 12.5px; color: #fff; text-shadow: 0 2px 0 #06224f; line-height: 1; }
.sqbtn .dot { top: -6px; right: -6px; }

/* badge dots */
.dot { position: absolute; min-width: 20px; height: 20px; border-radius: 999px; padding: 0 5px; background: linear-gradient(180deg, #ff7596, var(--danger)); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; border: 2px solid #05080d; box-shadow: 0 0 10px #ff3d7188, inset 0 1px 0 rgba(255,255,255,.4); line-height: 1; z-index: 2; animation: pulse 1.8s ease-in-out infinite; }
.dot.sm { min-width: 13px; height: 13px; padding: 0; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }

/* ---------- Home ---------- */
.home { padding: 14px 14px 0; }
.feat { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; border: 2px solid #00d9ff66; box-shadow: 0 5px 0 rgba(0,0,0,.6), 0 0 28px #00d9ff33; margin-bottom: 14px; text-align: left; transition: transform .15s; }
.feat canvas, .tile canvas, .band canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.feat::after, .tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(5,8,13,.85)); pointer-events: none; }
.feat .ft { position: absolute; left: 16px; bottom: 12px; right: 16px; z-index: 2; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.title-chunky { font-family: var(--display); color: #fff; -webkit-text-stroke: 5px #05080d; paint-order: stroke fill; text-shadow: 0 4px 0 #1f6bff, 0 0 18px #00d9ff88; letter-spacing: .01em; line-height: .95; }
.feat .title-chunky { font-size: 32px; }
.feat .sub { font-size: 13px; font-weight: 700; color: var(--ice); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.ribbon { position: absolute; z-index: 3; top: 22px; right: -48px; width: 210px; transform: rotate(35deg); text-align: center; padding: 5px 0 3px; font-family: var(--display); font-size: 14px; letter-spacing: .03em; color: #05080d; background: linear-gradient(180deg, #ffe3b8, var(--coin)); box-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 16px #ffcf8a66; }
.ribbon.sm { font-size: 10.5px; top: 14px; right: -44px; width: 160px; padding: 3px 0 2px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; border: 2px solid #00d9ff40; box-shadow: 0 5px 0 rgba(0,0,0,.6), 0 0 18px #00d9ff1f; transition: transform .15s; text-align: left; }
.tile .tt { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; font-size: 24px; text-align: center; }
.tile .genre { position: absolute; left: 10px; top: 10px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ice); background: rgba(5,8,13,.7); border: 1px solid var(--line2); border-radius: 999px; padding: 2px 8px 0; }
.tile .newchip { position: absolute; right: 10px; top: 10px; z-index: 2; font-family: var(--display); font-size: 12px; color: #fff; background: var(--danger); border-radius: 999px; padding: 2px 8px 1px; box-shadow: 0 2px 0 #7a0f2e; }
@media (hover: hover) { .tile:hover, .feat:hover { transform: scale(1.025); } }
.tile:active, .feat:active { transform: scale(.96); }
.sechead { display: flex; align-items: center; gap: 8px; margin: 18px 2px 10px; font-family: var(--display); font-size: 15px; letter-spacing: .04em; color: #eaf6ff; text-transform: uppercase; text-shadow: 0 2px 0 #06224f; }
.sechead::after { content: ''; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--line), transparent); }
.sechead svg { width: 18px; height: 18px; color: var(--neon); }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 12px 0; }

/* ---------- Detail ---------- */
.band { position: relative; height: 210px; overflow: hidden; border-bottom: 2px solid #00d9ff55; }
.band::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,8,13,.2), transparent 30%, rgba(5,8,13,.9)); pointer-events: none; }
.back { position: absolute; z-index: 3; left: 12px; top: 12px; width: 46px; height: 42px; border-radius: 14px; background: linear-gradient(180deg, #2d7bff, #1f4fcc); border: 1px solid #9af0ff66; box-shadow: var(--gloss); display: grid; place-items: center; color: #fff; }
.back svg { width: 24px; height: 24px; }
.band .bt { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 14px; }
.band .title-chunky { font-size: 34px; }
.band .bsub { font-size: 13px; font-weight: 700; color: var(--ice); margin-top: 6px; }
.bestpill { position: absolute; z-index: 3; right: 12px; top: 12px; }
.detail { padding: 0 14px; }
.mcard { position: relative; margin: 26px 0 0; border-radius: 20px; background: linear-gradient(180deg, #13223a, #0b1422); border: 2px solid #00d9ff44; box-shadow: 0 5px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1); display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; padding: 18px 12px 12px; }
.mcard.live { border-color: #ff3d7166; background: linear-gradient(180deg, #2a1424, #140c16); }
.mcard .flag { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--display); font-size: 15px; color: #05080d; padding: 4px 18px 2px; background: linear-gradient(180deg, #ffe3b8, var(--coin)); clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%); display: flex; align-items: center; gap: 6px; }
.mcard.live .flag { background: linear-gradient(180deg, #ff9ab5, var(--danger)); color: #fff; }
.mcard .pr { height: 72px; border-radius: 14px; background: #05080dcc; border: 1px solid var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.mcard .pr b { font-family: var(--display); font-size: 22px; color: var(--coin); font-weight: 400; display: flex; align-items: center; gap: 4px; line-height: 1; }
.mcard .pr b .ic { width: 20px; height: 20px; }
.mcard .pr small { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.mcard .nm { font-family: var(--display); font-size: 20px; color: #fff; line-height: 1.05; text-shadow: 0 2px 0 #06224f; }
.mcard .ds { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; line-height: 1.25; }
.mcard .side { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mcard .side small { font-size: 11px; color: var(--muted); font-weight: 700; text-align: center; max-width: 92px; line-height: 1.15; }
.play {
  font-family: var(--display); font-size: 19px; color: #05080d; letter-spacing: .02em; min-width: 92px; height: 42px; border-radius: 999px; padding: 2px 16px 0;
  background: linear-gradient(180deg, #b6f7ff 0%, #33e1ff 35%, #00c2ee 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,70,120,.35), 0 4px 0 #0a5f8c, 0 0 22px #00d9ff66;
  transition: transform .08s, box-shadow .08s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.play:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 1px 0 #0a5f8c, 0 0 16px #00d9ff55; }
.play.hot { background: linear-gradient(180deg, #ffc2d2, #ff5d86 40%, #e02c5c); color: #fff; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 4px 0 #7a0f2e, 0 0 22px #ff3d7166; text-shadow: 0 1px 0 #7a0f2e; }
.play.warm { background: linear-gradient(180deg, #fff3d6, var(--coin) 45%, #e0a95a); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 4px 0 #8a5a22, 0 0 20px #ffcf8a55; }
.play.sm { font-size: 15px; height: 34px; min-width: 76px; padding: 2px 12px 0; }
.play[disabled] { filter: grayscale(1) brightness(.6); cursor: default; box-shadow: 0 3px 0 #111; }
.livedot { width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #ff3d7155; display: inline-block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.actions { display: grid; gap: 8px; }
.act { display: grid; grid-template-columns: 30px 10px 1fr; align-items: center; gap: 10px; }
.act kbd { font-family: var(--display); font-size: 16px; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(180deg, #1a2a44, #0c1422); border: 1px solid var(--line); box-shadow: var(--gloss); color: #fff; }
.act i { width: 10px; height: 10px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.act i.bad { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.act span { font-weight: 700; color: #eaf2fb; }
.act small { color: var(--muted); font-weight: 600; margin-left: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; }
.stat small { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }

/* ---------- Other tabs ---------- */
.page { padding: 16px 14px 0; }
.ptitle { font-family: var(--display); font-size: 28px; color: #fff; text-shadow: 0 3px 0 #1f6bff, 0 0 18px #00d9ff55; margin: 2px 2px 4px; }
.pnote { color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 2px 12px; }
.card { background: linear-gradient(180deg, #111c2e, #0a111c); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: 0 4px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.h3 { font-family: var(--display); font-size: 18px; color: #fff; line-height: 1.1; }
.muted { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.shopgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item { background: linear-gradient(180deg, #111c2e, #0a111c); border: 1px solid var(--line2); border-radius: 18px; padding: 12px 6px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.5); }
.item.eq { border-color: var(--neon); box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 14px #00d9ff44; }
.item .nm { font-weight: 800; font-size: 13px; color: #eaf2fb; }
.price { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; }
.price .ic { width: 16px; height: 16px; }
.mini { font-family: var(--display); font-size: 13px; height: 28px; min-width: 70px; border-radius: 999px; padding: 1px 10px 0; background: linear-gradient(180deg, #1c3a6b, #10213d); border: 1px solid var(--line); box-shadow: var(--gloss); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.mini.on { background: linear-gradient(180deg, #b6f7ff, #00c2ee); color: #05080d; border-color: transparent; }
.mini[disabled] { opacity: .5; cursor: default; }
.mini .ic { width: 15px; height: 15px; }
.lb { display: grid; gap: 8px; }
.lbrow { display: grid; grid-template-columns: 28px 48px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line2); }
.lbrow .rk { font-family: var(--display); font-size: 20px; text-align: center; color: var(--muted); }
.lbrow.r1 .rk { color: var(--coin); } .lbrow.r2 .rk { color: var(--ice); } .lbrow.r3 .rk { color: #e0a95a; }
.lbrow .thumb { position: relative; width: 48px; height: 48px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.lbrow .thumb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.lbrow b { font-family: var(--display); font-weight: 400; font-size: 20px; color: #fff; font-variant-numeric: tabular-nums; }
.total { text-align: center; padding: 18px 14px; }
.total b { display: block; font-family: var(--display); font-weight: 400; font-size: 44px; color: #fff; text-shadow: 0 3px 0 #1f6bff, 0 0 22px #00d9ff66; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 6px; }
.cal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.day { position: relative; border-radius: 18px; padding: 10px 4px 8px; background: linear-gradient(180deg, #111c2e, #0a111c); border: 1px solid var(--line2); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.5); }
.day .dn { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.day .rw { font-family: var(--display); font-size: 17px; color: #fff; display: flex; align-items: center; gap: 3px; }
.day .rw .ic { width: 22px; height: 22px; }
.day.done { opacity: .55; }
.day.done::after { content: '✓'; position: absolute; top: 6px; right: 8px; color: var(--neon); font-weight: 800; }
.day.today { border: 2px solid var(--neon); box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 18px #00d9ff55; }
.day.big { grid-column: span 2; }
.tro { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line2); }
.trow .cup { width: 48px; height: 48px; border-radius: 14px; background: #05080d; border: 1px solid var(--line2); display: grid; place-items: center; }
.trow .cup svg { width: 34px; height: 34px; }
.trow.locked .cup svg { filter: grayscale(1) brightness(.5); }
.trow.got { border-color: #ffcf8a55; }
.bar { height: 8px; border-radius: 999px; background: #05080d; box-shadow: inset 0 1px 2px #000; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--deep), var(--neon)); box-shadow: 0 0 8px #00d9ff88; }
.bar.warm i { background: linear-gradient(90deg, #e0a95a, var(--coin)); box-shadow: 0 0 8px #ffcf8a88; }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; position: relative; z-index: 5; display: grid; grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr; align-items: end; height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: linear-gradient(180deg, #13223a, #0a121e); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.5); }
.tab { position: relative; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6d7f99; border-right: 1px solid #00d9ff12; transition: color .15s; }
.tab:nth-child(4), .tab:nth-child(2) { border-right: 0; }
.tab svg { width: 28px; height: 28px; transition: transform .15s; }
.tab span { font-family: var(--display); font-size: 11px; letter-spacing: .04em; }
.tab.on { color: var(--neon); }
.tab.on svg { filter: drop-shadow(0 0 8px #00d9ff99); transform: translateY(-2px); }
.tab .dot { top: 6px; right: calc(50% - 26px); }
.tab.center { height: 80px; margin-top: -16px; border-radius: 22px 22px 0 0; background: linear-gradient(180deg, #1f4fcc, #12306f 70%, #0d213f); border: 1px solid #9af0ff55; border-bottom: 0; color: #cfe8ff; box-shadow: 0 -4px 18px #1f6bff55, inset 0 1px 0 rgba(255,255,255,.25); }
.tab.center svg { width: 34px; height: 34px; }
.tab.center span { font-size: 15px; }
.tab.center.on { color: #fff; }

/* ---------- Player ---------- */
.player { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.pbar { flex: none; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; padding-top: env(safe-area-inset-top); background: #05080d; border-bottom: 1px solid var(--line2); }
.pclose { width: 34px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(180deg, #1c2a44, #0e1626); border: 1px solid var(--line); box-shadow: var(--gloss); color: #fff; }
.pclose svg { width: 18px; height: 18px; }
.pname { font-family: var(--display); font-size: 16px; color: #fff; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livechip { font-family: var(--display); font-size: 12px; color: #fff; background: var(--danger); border-radius: 6px; padding: 2px 7px 1px; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 0 12px #ff3d7166; }
.livechip i { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.pbest { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.frame { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
.pconfirm { position: absolute; inset: 44px 0 0; z-index: 3; background: #05080dd9; display: grid; place-items: center; padding: 20px; }
.pconfirm .card { max-width: 320px; width: 100%; text-align: center; }
.pconfirm .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }

/* toasts */
.toasts { position: absolute; left: 0; right: 0; top: 64px; z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 14px; }
.toast { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 20px #00d9ff33; text-align: center; max-width: 360px; animation: tin .35s cubic-bezier(.2,1.4,.4,1) both; }
.toast.out { animation: tout .3s ease both; }
.toast .big { font-family: var(--display); font-size: 21px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-variant-numeric: tabular-nums; }
.toast .big .ic { width: 24px; height: 24px; }
.toast .big em { font-style: normal; color: var(--coin); }
.toast .big .xp { color: var(--neon); }
.toast .sub { font-size: 12.5px; font-weight: 700; color: var(--ice); margin-top: 3px; }
@keyframes tin { from { opacity: 0; transform: translateY(-14px) scale(.9); } }
@keyframes tout { to { opacity: 0; transform: translateY(-10px); } }

/* sheet */
.sheetwrap { position: absolute; inset: 0; z-index: 30; background: #05080dcc; display: flex; align-items: flex-end; }
.sheet { position: relative; width: 100%; max-height: 88%; overflow-y: auto; background: linear-gradient(180deg, #111e33, #0a111c 40%); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 22px 16px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0,0,0,.6), 0 0 30px #00d9ff22; animation: up .32s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheet .x { position: absolute; right: 12px; top: 12px; width: 34px; height: 34px; border-radius: 12px; background: #05080d; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--muted); }
.sheet .x svg { width: 16px; height: 16px; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 26px; color: #fff; margin: 0 40px 4px 0; text-shadow: 0 3px 0 #1f6bff; }
.sheet .lead { color: var(--muted); font-weight: 600; font-size: 13.5px; margin: 0 0 14px; }
.center { text-align: center; }
.bigart { width: 132px; height: 132px; margin: 4px auto 8px; display: block; filter: drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 20px #00d9ff44); }
.wheelbox { position: relative; width: 270px; height: 270px; margin: 6px auto 14px; }
.wheelbox .wheel { width: 100%; height: 100%; transition: transform 4.2s cubic-bezier(.12,.8,.18,1); filter: drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px #00d9ff55); }
.wheelbox .ptr { position: absolute; left: 50%; top: -8px; width: 30px; height: 34px; transform: translateX(-50%); z-index: 2; filter: drop-shadow(0 3px 0 rgba(0,0,0,.6)); }
.mis { display: grid; gap: 10px; }
.mi { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line2); }
.mi .t { font-weight: 800; color: #eaf2fb; }
.mi .p { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; font-variant-numeric: tabular-nums; }
.dots7 { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
.dots7 i { width: 30px; height: 30px; border-radius: 50%; background: #05080d; border: 1px solid var(--line2); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 12px; color: var(--muted); }
.dots7 i.on { background: linear-gradient(180deg, #ffe3b8, var(--coin)); color: #05080d; border-color: transparent; box-shadow: 0 0 10px #ffcf8a88; }
.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.15); } }

@media (max-width: 360px) {
  .topbar { gap: 5px; padding-left: 8px; padding-right: 8px; }
  .pill { font-size: 13px; padding-right: 7px; }
  .pill .ic { width: 22px; height: 22px; }
  .tile .tt { font-size: 20px; }
  .feat .title-chunky { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

    $('toasts').style.top = $('player').hidden ? '64px' : '54px';
    $('toasts').appendChild(el);
    while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, ms || 3000);
  }

  // ---------- Sheets ----------
  let sheetClose = null;
  function openSheet(html, onClose) {
    $('sheet').innerHTML = `<button class="x" type="button" aria-label="Close">${I.x}</button>` + html;
    $('sheetwrap').hidden = false; sheetClose = onClose || null;
    $('sheet').querySelector('.x').onclick = closeSheet;
    setTimeout(() => { const b = $('sheet').querySelector('.play:not([disabled]), .x'); if (b) b.focus(); }, 30);
  }
  function closeSheet() { $('sheetwrap').hidden = true; $('sheet').innerHTML = ''; if (sheetClose) sheetClose(); sheetClose = null; }
  $('sheetwrap').addEventListener('click', e => { if (e.target === $('sheetwrap')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheetwrap').hidden) closeSheet(); });

  const PRIZES = [{ c: 50 }, { g: 2 }, { c: 100 }, { c: 75 }, { g: 5 }, { c: 150 }, { c: 60 }, { g: 10 }];
  const PW = [20, 12, 16, 20, 6, 10, 20, 2];
  let wheelRot = 0;
  function openSpin() {
    const ready = spinReady();
    openSheet(`<h2>Daily Spin</h2><p class="lead">One free spin every day. Resets at local midnight.</p>
      <div class="wheelbox"><svg class="ptr" viewBox="0 0 30 34"><path d="M3 3h24L15 31z" fill="#ffcf8a" stroke="#05080d" stroke-width="3" stroke-linejoin="round"/></svg>
      <svg class="wheel" id="wheel" viewBox="0 0 100 100" style="transform:rotate(${wheelRot}deg)">${wheelSVG(PRIZES, true)}</svg></div>
      <div class="center">${ready ? '<button class="play" type="button" id="spin-go" style="min-width:160px">SPIN!</button>' : `<button class="play" type="button" disabled style="min-width:160px">Next spin in <span class="num" data-t="midnight">${fmtT(msToMidnight())}</span></button>`}</div>`);
    const go = $('spin-go'); if (!go) return;
    go.onclick = () => {
      if (!spinReady()) return;
      go.disabled = true;
      let t = PW.reduce((a, b) => a + b) * Math.random(), k = 0; while ((t -= PW[k]) > 0) k++;
      S.spinDate = today(); persist();
      const target = (360 - k * 45) % 360; const cur = ((wheelRot % 360) + 360) % 360;
      wheelRot += 360 * 5 + ((target - cur + 360) % 360);
      $('wheel').style.transform = `rotate(${wheelRot}deg)`;
      setTimeout(() => {
        const p = PRIZES[k], r = p.c ? { coins: p.c } : { gems: p.g };
        give(r); persist();
        toast(`<div class="big">${p.c ? I.coin : I.gem}<em>${rewardTxt(r)}</em></div><div class="sub">Daily Spin</div>`);
        go.textContent = 'Come back tomorrow';
        renderAll();
      }, RM ? 200 : 4300);
    };
  }
  function openChest() {
    const left = chestLeft();
    openSheet(`<h2>Treasure Chest</h2><p class="lead">A free chest unlocks every 4 hours.</p>
      <div class="center"><span class="bigart" id="chest-art">${I.chest}</span>
      ${left ? `<button class="play" type="button" disabled style="min-width:170px">Opens in <span class="num" data-t="chest">${fmtT(left)}</span></button>` : '<button class="play warm" type="button" id="chest-go" style="min-width:170px">OPEN!</button>'}</div>`);
    const go = $('chest-go'); if (!go) return;
    go.onclick = () => {
      if (chestLeft()) return;
      const r = { coins: 60 + Math.floor(Math.random() * 11) * 10 }; if (Math.random() < 0.3) r.gems = 1 + Math.floor(Math.random() * 2);
      S.chestAt = Date.now(); give(r); persist();
      go.disabled = true; go.innerHTML = rewardTxt(r);
      toast(`<div class="big">${I.coin}<em>${rewardTxt(r)}</em></div><div class="sub">Treasure Chest · next in 4:00:00</div>`);
      renderAll();
    };
  }
  function openBonus() {
    const ready = bonusReady();
    openSheet(`<h2>Daily Coin Bonus</h2><p class="lead">Free coins once a day. No purchase, ever.</p>
      <div class="center"><span class="bigart">${I.coins}</span>
      ${ready ? '<button class="play warm" type="button" id="bonus-go" style="min-width:190px">Collect 100 coins</button>' : `<button class="play" type="button" disabled style="min-width:190px">Next bonus in <span class="num" data-t="midnight">${fmtT(msToMidnight())}</span></button>`}</div>`);
    const go = $('bonus-go'); if (!go) return;
    go.onclick = () => {
      if (!bonusReady()) return;
      S.bonusDate = today(); give({ coins: 100 }); persist();
      go.disabled = true; go.textContent = 'Collected!';
      toast(`<div class="big">${I.coin}<em>+100 coins</em></div><div class="sub">Daily bonus</div>`);
      renderAll();
    };
  }
  function missionsHTML() {
    return `<div class="mis">${MISSIONS.map(m => {
      const v = Math.min(m.goal, m.val()), done = v >= m.goal, got = S.daily.claimed.includes(m.id);
      return `<div class="mi"><div><div class="t">${m.text}</div><div class="bar${done ? ' warm' : ''}"><i style="width:${v / m.goal * 100}%"></i></div><div class="p"><span>${fmtN(v)} / ${fmtN(m.goal)}</span><span>${rewardTxt(m.reward)}</span></div></div>
        ${got ? '<button class="mini" disabled type="button">Claimed</button>' : `<button class="mini${done ? ' on' : ''}" type="button" data-claim="${m.id}" ${done ? '' : 'disabled'}>${done ? 'Claim' : 'Go'}</button>`}</div>`;
    }).join('')}</div>`;
  }
  function claimMission(id) {
    const m = MISSIONS.find(x => x.id === id); if (!m || !misDone(m) || S.daily.claimed.includes(id)) return;
    S.daily.claimed.push(id); give(m.reward); persist();
    toast(`<div class="big">${m.reward.gems ? I.gem : I.coin}<em>${rewardTxt(m.reward)}</em></div><div class="sub">Mission: ${m.text}</div>`);
    renderAll();
  }
  function openMissions() {
    const draw = () => {
      openSheet(`<h2>Daily Missions</h2><p class="lead">New missions in <span class="num" data-t="midnight">${fmtT(msToMidnight())}</span></p>${missionsHTML()}
        <div class="sechead">3 Challenge</div>${chalHTML()}`);
      $('sheet').querySelectorAll('[data-claim]').forEach(b => b.onclick = () => { claimMission(b.dataset.claim); draw(); });
      const cb = $('chal-go'); if (cb) cb.onclick = () => { claimChallenge(); draw(); };
    };
    draw();
  }
  function chalHTML() {
    const n = chalCount(), got = S.daily.claimed.includes('challenge');
    return `<div class="mi"><div><div class="t">Play 3 different games today</div><div class="bar${n >= 3 ? ' warm' : ''}"><i style="width:${n / 3 * 100}%"></i></div><div class="p"><span>${n} / 3 · ${S.daily.games.map(id => GAME[id].name).join(', ') || 'none yet'}</span><span>${rewardTxt(CHALLENGE.reward)}</span></div></div>
      ${got ? '<button class="mini" disabled type="button">Claimed</button>' : `<button class="mini${n >= 3 ? ' on' : ''}" type="button" id="chal-go" ${n >= 3 ? '' : 'disabled'}>${n >= 3 ? 'Claim' : 'Go'}</button>`}</div>`;
  }
  function claimChallenge() {
    if (!chalClaimable()) return;
    S.daily.claimed.push('challenge'); give(CHALLENGE.reward); persist();
    toast(`<div class="big">${I.gem}<em>${rewardTxt(CHALLENGE.reward)}</em></div><div class="sub">3 Challenge complete</div>`);
    renderAll();
  }
  function openChallenge() {
    const draw = () => {
      openSheet(`<h2>3 Challenge</h2><p class="lead">Finish a round in 3 different games today. Resets in <span class="num" data-t="midnight">${fmtT(msToMidnight())}</span></p>${chalHTML()}`);
      const cb = $('chal-go'); if (cb) cb.onclick = () => { claimChallenge(); draw(); };
    };
    draw();
  }
  function openStreak() {
    const n = streakNow(), playedToday = S.streak.last === today();
    openSheet(`<h2>Play Streak</h2><p class="lead">Finish at least one round every day to keep your streak. ${playedToday ? 'Done for today!' : 'Play today to keep it going.'}</p>
      <div class="center"><span class="bigart" style="position:relative">${I.flame}</span><div class="title-chunky" style="font-size:40px">${n} day${n === 1 ? '' : 's'}</div>
      <div class="dots7">${[1, 2, 3, 4, 5, 6, 7].map(i => `<i class="${i <= (n % 7 || (n ? 7 : 0)) ? 'on' : ''}">${i}</i>`).join('')}</div>
      <p class="muted">Best streak: ${S.streak.max || 0} days · Day ends in <span class="num" data-t="midnight">${fmtT(msToMidnight())}</span></p></div>`);
  }
  function openProfile() {
    const need = xpNeed(S.level);
    openSheet(`<h2>Your Profile</h2><p class="lead">Stored on this device only.</p>
      <div class="row" style="margin-bottom:14px">${avatarHTML(76)}<div class="grow"><div class="h3">Level ${S.level}</div><div class="bar"><i style="width:${S.xp / need * 100}%"></i></div><div class="muted" style="margin-top:4px">${S.xp} / ${need} XP to level ${S.level + 1}</div></div></div>
      <div class="stats"><div class="stat"><b>${fmtN(S.rounds)}</b><small>Rounds</small></div><div class="stat"><b>${fmtN(totalBest())}</b><small>Total best</small></div><div class="stat"><b>${fmtN(S.viewerTotal)}</b><small>Viewer acts</small></div></div>
      <div class="center" style="margin-top:16px"><button class="play" type="button" id="pf-shop">Customize look</button></div>`);
    $('pf-shop').onclick = () => { closeSheet(); setTab('shop'); };
  }
  $('ava-btn').onclick = openProfile;
  $('lvl-btn').onclick = openProfile;
  $('coin-plus').onclick = openBonus;
  $('gems-btn').onclick = () => setTab('shop');

  // ---------- Tabs ----------
  let tab = 'games';
  function setTab(t, keepDetail) {
    tab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    for (const v of ['games', 'shop', 'board', 'rewards', 'trophies']) $('view-' + v).hidden = v !== t;
    if (t === 'games' && !keepDetail && detailId) closeDetail();
    $('scroll').scrollTop = 0;
    renderAll();
    requestAnimationFrame(drawAllCovers);
  }
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

  function renderShop() {
    if (tab !== 'shop') return;
    const itemHTML = (it, kind) => {
      const owned = S.owned.includes(it.id), eq = (kind === 'frame' ? S.frame : S.badge) === it.id;
      const prev = kind === 'frame' ? avatarHTML(58, it.id, 'badge-none') : avatarHTML(58, 'frame-neon', it.id);
      let btn;
      if (eq) btn = '<button class="mini on" type="button" disabled>Equipped</button>';
      else if (owned) btn = `<button class="mini" type="button" data-equip="${it.id}" data-kind="${kind}">Equip</button>`;
      else btn = `<button class="mini" type="button" data-buy="${it.id}" data-kind="${kind}" ${S.gems < it.price ? 'disabled' : ''}>${I.gem}${it.price}</button>`;
      return `<div class="item${eq ? ' eq' : ''}">${prev}<span class="nm">${it.name}</span>${btn}</div>`;
    };
    $('view-shop').innerHTML = `
      <div class="ptitle">Shop</div><p class="pnote">Cosmetics only, bought with gems you earn by playing. Nothing here costs real money.</p>
      <div class="card row"><span style="width:56px;height:56px;flex:none">${I.gift}</span><div class="grow"><div class="h3">Daily free gift</div><div class="muted">${giftReady() ? '75 coins + 1 gem, on the house' : 'Next gift in <span class="num" data-t="midnight">' + fmtT(msToMidnight()) + '</span>'}</div></div>
        <button class="play sm warm" type="button" id="gift-go" ${giftReady() ? '' : 'disabled'}>${giftReady() ? 'Free' : 'Got it'}</button></div>
      <div class="sechead">Avatar frames</div><div class="shopgrid">${FRAMES.map(f => itemHTML(f, 'frame')).join('')}</div>
      <div class="sechead">Profile badges</div><div class="shopgrid">${BADGES.map(b => itemHTML(b, 'badge')).join('')}</div>`;
    const gg = $('gift-go'); if (gg) gg.onclick = () => { if (!giftReady()) return; S.giftDate = today(); give({ coins: 75, gems: 1 }); persist(); toast(`<div class="big">${I.coin}<em>+75 coins · +1 gem</em></div><div class="sub">Daily free gift</div>`); renderAll(); };
    $('view-shop').querySelectorAll('[data-equip]').forEach(b => b.onclick = () => { S[b.dataset.kind] = b.dataset.equip; persist(); renderAll(); });
    $('view-shop').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const list = b.dataset.kind === 'frame' ? FRAMES : BADGES, it = list.find(x => x.id === b.dataset.buy);
      openSheet(`<h2>${it.name}</h2><p class="lead">${b.dataset.kind === 'frame' ? 'Avatar frame' : 'Profile badge'} · purely cosmetic</p>
        <div class="center">${b.dataset.kind === 'frame' ? avatarHTML(110, it.id, S.badge) : avatarHTML(110, S.frame, it.id)}
        <div style="margin-top:18px"><button class="play" type="button" id="buy-go">Buy for ${it.price} gems</button></div><p class="muted" style="margin-top:10px">You have ${S.gems} gems</p></div>`);
      $('buy-go').onclick = () => {
        if (S.gems < it.price || S.owned.includes(it.id)) return closeSheet();
        S.gems -= it.price; S.owned.push(it.id); S[b.dataset.kind] = it.id; persist(); closeSheet();
        toast(`<div class="big">${I.gem}<em>${it.name} unlocked</em></div><div class="sub">Equipped</div>`);
        renderAll();
      };
    });
  }
  function renderBoard() {
    if (tab !== 'board') return;
    const rows = GAMES.map(g => ({ g, b: S.best[g.id] || 0 })).sort((a, b) => b.b - a.b);
    $('view-board').innerHTML = `<div class="ptitle">Leaderboard</div><p class="pnote">Your personal bests. Local only: scores stay on this device and are not ranked online.</p>
      <div class="card total"><div class="muted" style="letter-spacing:.12em;text-transform:uppercase;font-weight:800">Total of best scores</div><b>${fmtN(totalBest())}</b><div class="muted" style="margin-top:6px">${fmtN(S.rounds)} rounds played</div></div>
      <div class="sechead">Per game</div>
      <div class="lb">${rows.map((r, i) => `<button class="lbrow r${i + 1}" type="button" data-game="${r.g.id}" style="text-align:left"><span class="rk">${i + 1}</span><span class="thumb"><canvas data-cover="${r.g.id}"></canvas></span><span><span class="h3" style="font-size:16px">${r.g.name}</span><br><span class="muted">${fmtN(S.plays[r.g.id] || 0)} rounds</span></span><b>${fmtN(r.b)}</b></button>`).join('')}</div>`;
    $('view-board').querySelectorAll('[data-game]').forEach(b => b.onclick = () => openDetail(b.dataset.game));
  }
  function renderRewards() {
    if (tab !== 'rewards') return;
    const next = loginNextDay(), ready = loginReady();
    $('view-rewards').innerHTML = `<div class="ptitle">Rewards</div><p class="pnote">Log in every day to fill the week. Miss a day and it starts over at Day 1.</p>
      <div class="cal">${LOGIN.map((r, i) => {
        const d = i + 1, done = ready ? d < next : d <= next, today_ = ready && d === next;
        return `<div class="day${done ? ' done' : ''}${today_ ? ' today' : ''}${d === 7 ? ' big' : ''}"><span class="dn">Day ${d}</span><span class="rw">${r.gems && !r.coins ? I.gem : I.coin}${r.coins ? fmtN(r.coins) : r.gems}</span>${r.coins && r.gems ? `<span class="rw" style="font-size:14px">${I.gem}${r.gems}</span>` : ''}${today_ ? '<button class="mini on" type="button" id="login-go">Claim</button>' : ''}</div>`;
      }).join('')}</div>
      <p class="muted center" style="margin:10px 0 0">${ready ? 'Today\'s reward is ready!' : 'Next reward in <span class="num" data-t="midnight">' + fmtT(msToMidnight()) + '</span>'}</p>
      <div class="sechead">More free stuff</div>
      <div style="display:grid;gap:10px">
        <div class="card row"><span style="width:48px;height:48px;flex:none">${I.wheel}</span><div class="grow"><div class="h3">Daily Spin</div><div class="muted">${spinReady() ? 'Ready to spin' : 'Next in ' + fmtT(msToMidnight())}</div></div><button class="play sm" type="button" data-open="spin">${spinReady() ? 'Spin' : 'View'}</button></div>
        <div class="card row"><span style="width:48px;height:48px;flex:none">${I.chest}</span><div class="grow"><div class="h3">Treasure Chest</div><div class="muted">${chestLeft() ? 'Opens in <span class="num" data-t="chest">' + fmtT(chestLeft()) + '</span>' : 'Ready to open'}</div></div><button class="play sm warm" type="button" data-open="chest">${chestLeft() ? 'View' : 'Open'}</button></div>
        <div class="card row"><span style="width:48px;height:48px;flex:none">${I.coins}</span><div class="grow"><div class="h3">Daily Coin Bonus</div><div class="muted">${bonusReady() ? '100 free coins' : 'Collected today'}</div></div><button class="play sm warm" type="button" data-open="bonus">${bonusReady() ? 'Collect' : 'View'}</button></div>
      </div>`;
    const lg = $('login-go');
    if (lg) lg.onclick = () => {
      if (!loginReady()) return;
      const d = loginNextDay(), r = LOGIN[d - 1];
      S.login = { day: d, last: today() }; give(r); persist();
      toast(`<div class="big">${r.coins ? I.coin : I.gem}<em>${rewardTxt(r)}</em></div><div class="sub">Day ${d} login reward</div>`);
      renderAll();
    };
    $('view-rewards').querySelectorAll('[data-open]').forEach(b => b.onclick = () => ({ spin: openSpin, chest: openChest, bonus: openBonus })[b.dataset.open]());
  }
  function renderTrophies() {
    if (tab !== 'trophies') return;
    $('view-trophies').innerHTML = `<div class="ptitle">Trophies</div><p class="pnote">${S.trophies.length} of ${TROPHIES.length} claimed. Each trophy pays out gems.</p>
      <div class="tro">${TROPHIES.map(t => {
        const v = Math.min(t.goal, t.val()), done = v >= t.goal, got = S.trophies.includes(t.id);
        return `<div class="trow${done ? '' : ' locked'}${got ? ' got' : ''}"><span class="cup">${I.cup}</span><div><div class="h3" style="font-size:16px">${t.name}</div><div class="muted">${t.desc}</div><div class="bar${done ? ' warm' : ''}"><i style="width:${v / t.goal * 100}%"></i></div><div class="muted num" style="margin-top:3px;font-size:11.5px">${fmtN(v)} / ${fmtN(t.goal)}</div></div>
          ${got ? '<button class="mini" type="button" disabled>Claimed</button>' : `<button class="mini${done ? ' on' : ''}" type="button" data-tro="${t.id}" ${done ? '' : 'disabled'}>${I.gem}${t.gems}</button>`}</div>`;
      }).join('')}</div>`;
    $('view-trophies').querySelectorAll('[data-tro]').forEach(b => b.onclick = () => {
      const t = TROPHIES.find(x => x.id === b.dataset.tro); if (!t || S.trophies.includes(t.id) || t.val() < t.goal) return;
      S.trophies.push(t.id); give({ gems: t.gems }); persist();
      toast(`<div class="big">${I.gem}<em>+${t.gems} gems</em></div><div class="sub">Trophy: ${t.name}</div>`);
      renderAll();
    });
  }
  function renderBadges() {
    const set = (k, n) => { const el = document.querySelector(`[data-badge="${k}"]`); el.hidden = !n; el.textContent = n || ''; };
    set('shop', giftReady() ? 1 : 0);
    set('rewards', (loginReady() ? 1 : 0) + (bonusReady() ? 1 : 0) + (spinReady() ? 1 : 0) + (chestLeft() ? 0 : 1));
    set('trophies', troClaimable().length);
    set('games', tab === 'games' ? 0 : misClaimable().length + (chalClaimable() ? 1 : 0));
  }

  function renderAll() {
    renderTop(); renderStrip(); renderMissionRow(); renderBadges();
    if (tab === 'games') { if (detailId) { const st = $('scroll').scrollTop; renderDetail(); $('scroll').scrollTop = st; } else if (!$('home').children.length) renderHome(); }
    renderShop(); renderBoard(); renderRewards(); renderTrophies();
    requestAnimationFrame(drawAllCovers);
  }

  hydrateIcons(document);
  renderHome();
  renderAll();
  setInterval(tickTimers, 1000);
  let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawAllCovers, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawAllCovers);
})();
</script>
</body>
</html>
