<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fenrir Siege</title>
<meta name="description" content="Build a Norse wolf-clan village, train an army and raid rival villages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #05080d;
    --panel: #0a0f16;
    --panel2: #0f1722;
    --line: #00d9ff38;
    --line2: #00d9ff66;
    --text: #d8e0ea;
    --muted: #7d8899;
    --neon: #00d9ff;
    --ice: #9af0ff;
    --deep: #1f6bff;
    --danger: #ff3d71;
    --gold: #ffcf8a;
    --mead: #e7a93b;
    --rune: #8a5cff;
    --good: #50ffa0;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --disp: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1418; color: var(--text); font: 15px/1.35 var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  canvas#game { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .ic { display: inline-flex; width: 1.15em; height: 1.15em; vertical-align: -0.2em; margin-right: 0.18em; flex: none; }
  .ic svg { width: 100%; height: 100%; }
  .ic.tiny { width: 0.95em; height: 0.95em; }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .pos { color: var(--good); }
  .neg { color: var(--danger); }
  .lbl { font: 700 0.7rem var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 10px 0 6px; }
  .panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 24px #0008; }

  /* ---------- HUD ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud > * { pointer-events: auto; }
  body:not(.mode-village) #hud { display: none; }
  .hud-tl { position: absolute; left: 10px; top: calc(10px + var(--st)); display: flex; flex-direction: column; gap: 6px; }
  .pcard { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; }
  .lvl-badge { width: 42px; height: 46px; display: grid; place-items: center; background: linear-gradient(160deg, var(--deep), #0b2a55); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font: 800 1.15rem var(--disp); color: #fff; text-shadow: 0 1px 0 #0008; flex: none; }
  .lvl-badge.big { width: 58px; height: 64px; font-size: 1.5rem; }
  .pname { font: 700 0.98rem var(--disp); line-height: 1.05; max-width: 118px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xpbar { height: 4px; border-radius: 3px; background: #1a2533; margin: 3px 0; width: 100%; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: var(--neon); width: 0; transition: width 0.4s; }
  .trow { display: flex; align-items: center; gap: 4px; font: 700 0.85rem var(--disp); white-space: nowrap; }
  .trow .ic { width: 1.05em; height: 1.05em; }
  #league { font: 600 0.7rem var(--font); letter-spacing: 0.04em; margin-left: 2px; }
  .chips-row { display: flex; gap: 6px; }
  .chip-s { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; font: 700 0.82rem var(--disp); border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .chip-s svg { width: 18px; height: 18px; }
  .hud-tr { position: absolute; right: 10px; top: calc(10px + var(--st)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .res { display: flex; align-items: center; }
  .res-bar { position: relative; width: 132px; height: 26px; border-radius: 8px 0 0 8px; background: var(--panel); border: 1px solid var(--line); border-right: 0; overflow: hidden; margin-right: -8px; }
  .res-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; opacity: 0.26; transition: width 0.5s; }
  .res[data-res=gold] .fill { background: var(--gold); } .res[data-res=mead] .fill { background: var(--mead); } .res[data-res=rs] .fill { background: var(--rune); } .res[data-res=gems] .fill { background: transparent; }
  .res.full .res-bar { border-color: #ff3d7188; }
  .res-bar .val { position: absolute; right: 14px; top: 1px; font: 800 1rem var(--disp); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000a; }
  .res-bar .cap { position: absolute; left: 7px; bottom: 1px; font: 600 0.58rem var(--font); color: var(--muted); letter-spacing: 0.02em; }
  .res[data-res=gems] .cap, .res.long .cap { display: none; }
  .res.long .res-bar .val { font-size: 0.9rem; top: 3px; }
  .res-ic { width: 30px; height: 30px; margin: 0; filter: drop-shadow(0 2px 3px #0009); position: relative; z-index: 1; }
  .res.bump .res-ic { animation: bump 0.35s; }
  @keyframes bump { 40% { transform: scale(1.3); } }
  .brand { position: absolute; left: 50%; top: calc(12px + var(--st)); transform: translateX(-50%); width: 34px; height: 34px; opacity: 0.85; pointer-events: none; filter: drop-shadow(0 0 6px #00d9ff66); }
  .hud-bottom { position: absolute; left: 0; right: 0; bottom: calc(12px + var(--sb)); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 12px; transition: transform 0.25s, opacity 0.25s; }
  .hud-bottom.hide { transform: translateY(140%); opacity: 0; pointer-events: none; }
  .bigbtn { width: 86px; height: 86px; border-radius: 22px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font: 800 1.02rem var(--disp); color: #05080d; box-shadow: 0 6px 0 #0a3b66, 0 10px 24px #0009; transition: transform 0.1s; }
  .bigbtn svg { width: 44px; height: 44px; }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #0a3b66, 0 6px 16px #0009; }
  #btn-attack { background: linear-gradient(180deg, #5fe9ff, var(--neon) 55%, #0aa4c8); }
  #btn-shop { background: linear-gradient(180deg, #ffe2b0, var(--gold) 55%, #d49a4a); box-shadow: 0 6px 0 #7a5220, 0 10px 24px #0009; }
  .midbtns { display: flex; gap: 8px; margin-bottom: 4px; }
  .rbtn { position: relative; width: 52px; height: 58px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 700 0.66rem var(--font); letter-spacing: 0.03em; color: var(--ice); }
  .rbtn svg { width: 24px; height: 24px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font: 800 0.72rem/20px var(--font); text-align: center; padding: 0 5px; box-shadow: 0 0 10px #ff3d7199; }

  /* ---------- building sheet ---------- */
  .sheet { position: fixed; left: 50%; bottom: 0; width: min(100%, 540px); transform: translate(-50%, 110%); transition: transform 0.22s ease-out; z-index: 20; padding: 12px 14px calc(14px + var(--sb)); border-radius: 18px 18px 0 0; border-bottom: 0; }
  .sheet.open { transform: translate(-50%, 0); }
  body:not(.mode-village) .sheet { display: none; }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sheet-title { margin: 0; font: 800 1.25rem var(--disp); line-height: 1.1; }
  #sheet-title small { font: 600 0.8rem var(--font); color: var(--neon); margin-left: 6px; letter-spacing: 0.02em; }
  .xbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 1.2rem; line-height: 1; color: var(--muted); flex: none; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; margin: 8px 0 10px; }
  .stat { display: flex; justify-content: space-between; gap: 6px; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid #ffffff08; padding: 2px 0; }
  .stat b { color: var(--text); font-weight: 600; text-align: right; }
  .stat em { color: var(--good); font-style: normal; }
  .sbtns { display: flex; flex-wrap: wrap; gap: 8px; }
  .sbtn { flex: 1 1 auto; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); padding: 6px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 0.92rem var(--disp); white-space: nowrap; }
  .sbtn em { font: 600 0.75rem var(--font); color: var(--muted); font-style: normal; margin-left: 4px; display: inline-flex; align-items: center; }
  .sbtn.pri { background: linear-gradient(180deg, #13455c, #0c2c3d); border-color: var(--neon); color: #e8fbff; box-shadow: 0 0 14px #00d9ff33; }
  .sbtn.pri em { color: #bfefff; }
  .sbtn.danger { border-color: #ff3d7188; color: #ffb0c4; }
  .sbtn.ghostb { background: transparent; }
  .sbtn.dis { opacity: 0.5; pointer-events: none; }
  .sbtn.wide { width: 100%; }
  .sbtn.attack { background: linear-gradient(180deg, #5fe9ff, var(--neon)); color: #05080d; border-color: var(--neon); font-size: 1.05rem; }
  .cost { display: inline-flex; align-items: center; font-variant-numeric: tabular-nums; }
  .cost.short { color: var(--danger); }
  .mini { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 4px 10px; font: 700 0.8rem var(--disp); display: inline-flex; align-items: center; gap: 4px; }
  .mini.pri { border-color: var(--neon); color: #e8fbff; }

  /* ---------- placement bar ---------- */
  #place-bar { position: fixed; left: 0; top: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #place-bar > * { pointer-events: auto; }
  #place-name { font: 700 0.8rem var(--disp); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .pbtns { display: flex; gap: 14px; }
  .pbtn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff3; font-size: 1.5rem; font-weight: 800; display: grid; place-items: center; box-shadow: 0 4px 14px #000a; }
  #place-ok { background: var(--good); color: #05260f; }
  #place-ok.bad { background: #3a4452; color: #8a93a2; }
  #place-no { background: var(--danger); color: #3a0010; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: calc(12px + var(--st)) 10px calc(12px + var(--sb)); background: #02050acc; }
  .mbox { width: min(100%, 560px); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .mhdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #modal-title { margin: 0; font: 800 1.35rem var(--disp); }
  #modal-body { overflow-y: auto; padding: 10px 14px 16px; -webkit-overflow-scrolling: touch; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
  .tab { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 7px 8px; font: 700 0.88rem var(--disp); color: var(--muted); white-space: nowrap; }
  .tab.on { background: #0e2a38; color: #e8fbff; border-color: var(--neon); }
  .grid { display: grid; gap: 8px; }
  .shop-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .card-b { position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  .card-b b { font: 800 0.92rem var(--disp); line-height: 1.1; }
  .card-b .cnt { position: absolute; top: 6px; right: 8px; font: 700 0.72rem var(--font); color: var(--muted); }
  .card-b .row { display: flex; gap: 6px; align-items: center; font: 700 0.85rem var(--disp); flex-wrap: wrap; justify-content: center; }
  .card-b .row em, .tcard em { font: 600 0.72rem var(--font); color: var(--muted); font-style: normal; display: inline-flex; align-items: center; }
  .card-b.locked, .tcard.locked { opacity: 0.55; }
  .lock { font: 600 0.72rem var(--font); color: var(--danger); }
  .thumb { width: 100%; max-width: 120px; height: auto; aspect-ratio: 4/3; }
  .thumb.big { display: block; margin: 0 auto; max-width: 220px; }
  .troop-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .tcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 0.82rem; }
  .tcard canvas { width: 52px; height: 52px; }
  .tcard b { font: 800 0.86rem var(--disp); line-height: 1.1; text-align: center; }
  .tcard .lv { font-size: 0.68rem; color: var(--muted); }
  .tcard:active, .card-b:active { transform: scale(0.97); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; display: inline-flex; align-items: center; gap: 2px; padding: 2px 8px 2px 2px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); font: 700 0.85rem var(--disp); }
  .chip canvas { width: 34px; height: 34px; }
  .chip.q { border-style: dashed; }
  .chip .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: #fff; font: 800 0.8rem/18px var(--font); text-align: center; }
  .chip.dim { opacity: 0.5; }
  .capbar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 0.8rem; color: var(--muted); margin: 4px 0 8px; }
  .capbar b { color: var(--text); font: 700 0.9rem var(--disp); }
  .bar { position: relative; height: 10px; border-radius: 6px; background: #1a2533; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; background: var(--neon); }
  .bar i.q { background: repeating-linear-gradient(45deg, #00d9ff66 0 4px, #00d9ff22 4px 8px); }
  .warn { color: var(--danger); font-size: 0.8rem; margin: 6px 0; }
  .empty { padding: 18px 8px; text-align: center; color: var(--muted); }
  .hero-card { display: flex; gap: 12px; align-items: flex-start; }
  .hero-card > canvas { width: 104px; height: 104px; flex: none; background: radial-gradient(#00d9ff22, transparent 70%); border-radius: 50%; }
  .hero-card > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .hero-card p { margin: 0; font-size: 0.85rem; }
  .big { font: 800 1.2rem var(--disp); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 8px; }
  .tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 4px; border-bottom: 1px solid #ffffff08; }
  .tbl tr.on td { background: #00d9ff14; color: #fff; }
  .menu { display: flex; flex-direction: column; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
  .field input, textarea { font: 600 0.95rem var(--font); color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; user-select: text; -webkit-user-select: text; }
  textarea { resize: vertical; font: 0.72rem/1.3 ui-monospace, Menlo, monospace; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .big-btn { width: 100%; min-height: 64px; margin: 12px 0 8px; border: 0; border-radius: 16px; background: linear-gradient(180deg, #5fe9ff, var(--neon) 55%, #0aa4c8); color: #05080d; display: flex; align-items: center; justify-content: center; gap: 10px; font: 800 1.3rem var(--disp); box-shadow: 0 5px 0 #0a3b66, 0 10px 22px #0008; }
  .big-btn > svg { width: 38px; height: 38px; flex: none; }
  .big-btn .cost { background: #05080dcc; color: var(--gold); padding: 2px 10px; border-radius: 999px; font-size: 1rem; }
  .big-btn .cost.short { color: var(--danger); }
  .big-btn[disabled] { filter: grayscale(0.8); opacity: 0.6; }
  .big-btn:active { transform: translateY(3px); }
  .profile { display: flex; gap: 12px; align-items: center; }
  .leagues { display: flex; flex-wrap: wrap; gap: 6px; }
  .lg { font: 700 0.78rem var(--disp); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); color: var(--c); border-radius: 999px; padding: 2px 10px; opacity: 0.45; }
  .lg.on { opacity: 1; background: color-mix(in srgb, var(--c) 14%, transparent); }
  .lg em { font: 600 0.65rem var(--font); margin-left: 4px; font-style: normal; color: var(--muted); }
  .ach { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .ach.ready { border-color: var(--neon); box-shadow: 0 0 14px #00d9ff33; }
  .ah { display: flex; justify-content: space-between; font: 800 0.95rem var(--disp); }
  .tiers i, .stars i, .rstars i, #bh-stars i { font-style: normal; color: #2a3444; }
  .tiers i.on, .stars i.on, #bh-stars i.on { color: var(--neon); text-shadow: 0 0 8px #00d9ff88; }
  .ach .bar { margin: 6px 0 4px; height: 6px; }
  .arow { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }
  .log { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .log.win { border-left-color: var(--good); }
  .lh { display: flex; flex-direction: column; }
  .lh b { font: 800 1rem var(--disp); }
  .lh .muted { font-size: 0.75rem; }
  .lrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 700 0.9rem var(--disp); margin: 4px 0; }
  .lloot { font-size: 0.82rem; }
  .lres { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--muted); }

  /* ---------- match / battle ---------- */
  .match { position: fixed; left: 0; right: 0; bottom: calc(10px + var(--sb)); z-index: 12; display: flex; justify-content: center; padding: 0 10px; }
  .mcard { width: min(100%, 520px); background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; padding: 12px 14px; box-shadow: 0 10px 40px #000c; }
  .mhead { display: flex; justify-content: space-between; gap: 10px; }
  .mhead .lbl { margin-top: 0; }
  .offer { text-align: right; display: flex; flex-direction: column; }
  .offer .lbl { margin: 0 0 2px; }
  .offer .win { color: var(--good); font: 800 1.1rem var(--disp); }
  .offer .lose { color: var(--danger); font: 700 0.85rem var(--disp); }
  .loot { display: flex; gap: 14px; flex-wrap: wrap; font: 800 1.2rem var(--disp); }
  .loot span { display: inline-flex; align-items: center; gap: 2px; }
  .mbtns { display: grid; grid-template-columns: 0.8fr 1.2fr 1.3fr; gap: 8px; margin-top: 12px; }
  #battle { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #battle > * { pointer-events: auto; }
  body.mode-village #battle { display: none; }
  .bh-tl { position: absolute; left: 10px; top: calc(10px + var(--st)); padding: 7px 10px; max-width: 46vw; }
  .bh-tl b.t { display: block; font: 800 1rem var(--disp); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bh-tl .sub { font-size: 0.7rem; color: var(--muted); }
  #bh-loot { display: flex; flex-direction: column; font: 800 0.95rem var(--disp); }
  #bh-loot span { display: flex; align-items: center; gap: 2px; }
  #bh-got { font: 600 0.72rem var(--font); color: var(--good); }
  .bh-tl .lbl { margin: 4px 0 2px; font-size: 0.6rem; }
  .bh-tc { position: absolute; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); text-align: center; padding: 4px 14px; }
  #bh-time { font: 800 1.6rem/1.1 var(--disp); font-variant-numeric: tabular-nums; }
  #bh-time.low { color: var(--danger); }
  .bh-tc .lbl { margin: 0; font-size: 0.56rem; }
  .bh-tr { position: absolute; right: 10px; top: calc(10px + var(--st)); padding: 6px 10px; text-align: right; }
  #bh-stars { font-size: 1.5rem; line-height: 1; letter-spacing: 0.04em; }
  #bh-pct { font: 800 1.35rem var(--disp); }
  body.mode-match .bh-tc, body.mode-match .tray, body.mode-match .bh-ctrl, body.mode-results .tray, body.mode-results .bh-ctrl, body.mode-match .bh-tr { display: none; }
  .tray { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(8px + var(--sb)); display: flex; gap: 6px; overflow-x: auto; background: linear-gradient(0deg, #05080df0, #05080d99 70%, transparent); scrollbar-width: none; }
  .tray::-webkit-scrollbar { display: none; }
  .tray-card { position: relative; flex: none; width: 66px; height: 84px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 2px 2px 0; }
  .tray-card canvas { width: 48px; height: 48px; }
  .tray-card .n { font: 800 0.95rem var(--disp); line-height: 1; }
  .tray-card .nm { font: 600 0.58rem var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tray-card .tlv { position: absolute; top: 3px; left: 4px; font: 800 0.62rem var(--font); color: var(--ice); background: #05080dcc; border-radius: 5px; padding: 0 4px; }
  .tray-card.spell { border-color: #9af0ff55; }
  .tray-card.hero { border-color: #1f6bff; }
  .tray-card.sel { border: 2px solid var(--neon); background: #0e2a38; box-shadow: 0 0 16px #00d9ff55; transform: translateY(-4px); }
  .tray-card.empty { opacity: 0.35; }
  .tray-card.ability { border-color: var(--neon); animation: pulse 0.9s infinite alternate; }
  .tray-card.ability .n { color: var(--neon); }
  .tray-card.hero .n { font-size: 0.74rem; white-space: nowrap; }
  @keyframes pulse { to { box-shadow: 0 0 22px #00d9ffaa; } }
  .bh-ctrl { position: absolute; left: 10px; bottom: calc(104px + var(--sb)); display: flex; gap: 8px; }
  .bh-ctrl button { border-radius: 12px; padding: 8px 14px; font: 800 0.9rem var(--disp); background: var(--panel); border: 1px solid #ff3d7199; color: #ffb0c4; }
  body.replay .bh-ctrl, #battle .bh-ctrl.replay { bottom: calc(16px + var(--sb)); }
  #btn-skip, #btn-speed { border-color: var(--line2) !important; color: var(--ice) !important; }
  #btn-pause { position: absolute; right: 10px; top: calc(92px + var(--st)); width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; gap: 5px; align-items: center; justify-content: center; }
  #btn-pause span { width: 5px; height: 16px; background: var(--muted); border-radius: 2px; }
  body:not(.mode-battle) #btn-pause { display: none; }
  #star-pop { position: fixed; left: 50%; top: 38%; z-index: 40; font-size: 120px; color: var(--neon); text-shadow: 0 0 40px #00d9ff; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  #star-pop.go { animation: starpop 1.1s ease-out; }
  @keyframes starpop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-30deg); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(0); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(40vw, -46vh) scale(0.2); } }

  /* ---------- results / pause / confirm ---------- */
  .ov { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; padding: 16px; background: #02050acc; }
  .rcard { width: min(100%, 380px); background: var(--panel); border: 1px solid var(--line2); border-radius: 20px; padding: 18px 18px 16px; text-align: center; display: flex; flex-direction: column; align-items: stretch; gap: 4px; box-shadow: 0 10px 50px #000; animation: rin 0.35s ease-out; }
  @keyframes rin { from { transform: scale(0.85); opacity: 0; } }
  .rcard .lbl { margin: 0; }
  .rcard h2 { margin: 0; font: 800 2.2rem/1.1 var(--disp); }
  .rcard.win h2 { color: var(--neon); text-shadow: 0 0 20px #00d9ff66; }
  .rcard.lose h2 { color: var(--danger); }
  .rstars { font-size: 3.2rem; line-height: 1.1; letter-spacing: 0.05em; }
  .rstars i.on { color: var(--neon); animation: sin 0.5s both; display: inline-block; text-shadow: 0 0 18px #00d9ff; }
  @keyframes sin { from { transform: scale(2.6) rotate(-40deg); opacity: 0; } }
  .rpct { font: 700 1rem var(--disp); color: var(--muted); }
  .rrows { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; text-align: left; }
  .rrow { display: flex; justify-content: space-between; align-items: center; font: 700 1rem var(--disp); background: var(--panel2); border-radius: 10px; padding: 5px 10px; }
  .rrow span { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; }
  .rcard .chips { justify-content: center; }
  .rcard .big-btn > svg { stroke: #05080d; width: 30px; height: 30px; }
  .rcard .big-btn > svg path { stroke: #05080d; }
  .pcardx { width: min(100%, 320px); background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  .pcardx h2 { margin: 0; font: 800 1.6rem var(--disp); }
  .pcardx p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  #confirm { z-index: 50; }
  .cbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

  /* ---------- toasts / legend ---------- */
  #toasts { position: fixed; left: 50%; top: calc(172px + var(--st)); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: max-content; max-width: 92vw; }
  .toast { display: flex; align-items: center; gap: 8px; background: #0a0f16f0; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 16px 7px 12px; font: 700 0.9rem var(--disp); box-shadow: 0 6px 20px #000a; animation: tin 0.25s ease-out; transition: opacity 0.3s, transform 0.3s; }
  .toast .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .toast.good { border-color: #00d9ff99; box-shadow: 0 0 18px #00d9ff44; } .toast.good .dot { background: var(--neon); box-shadow: 0 0 8px var(--neon); }
  .toast.bad { border-color: #ff3d7199; box-shadow: 0 0 18px #ff3d7144; } .toast.bad .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .toast.out { opacity: 0; transform: translateY(-8px); }
  @keyframes tin { from { transform: translateY(-10px) scale(0.9); opacity: 0; } }
  #live-legend { position: fixed; left: 10px; bottom: calc(118px + var(--sb)); z-index: 16; background: #0a0f16ee; border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 8px; font-size: 0.78rem; pointer-events: none; }
  body.mode-battle #live-legend { bottom: auto; top: calc(150px + var(--st)); }
  #live-legend .lbl { margin: 0 0 4px; }
  .lk { display: flex; align-items: center; gap: 6px; line-height: 1.6; }
  .lk kbd { font: 700 0.7rem var(--font); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; }
  .lk .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neon); }
  .lk .dot.bad { background: var(--danger); }

  @media (min-width: 900px) {
    .res-bar { width: 170px; height: 30px; } .res-bar .val { font-size: 1.1rem; top: 2px; }
    .res-ic { width: 34px; height: 34px; }
    .bigbtn { width: 96px; height: 96px; }

    .res-bar { width: 108px; } .pname { max-width: 92px; } .bigbtn { width: 74px; height: 74px; font-size: 0.9rem; } .rbtn { width: 46px; }
  }
</style>
</head>

  <div class="bh-ctrl"><button type="button" id="btn-end">End battle</button><button type="button" id="btn-skip" hidden>Skip</button><button type="button" id="btn-speed" hidden>2×</button></div>

<div id="star-pop"></div>
